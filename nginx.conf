server {
    listen 80;
    server_name _;

    # Cho phép gửi payload văn bản lớn (batch embeddings / reranking)
    client_max_body_size 64M;
    
    # Timeout dài hơn để xử lý batch lớn
    proxy_read_timeout 300s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;

    # Trang thông tin tổng quan tại root "/"
    location = / {
        default_type application/json;
        return 200 '{"status":"online","service":"Text Embeddings Inference Gateway (Vietnamese)","endpoints":{"embedding":{"native":"POST /embed","openai_compatible":"POST /v1/embeddings","info":"GET /info/embedding","health":"GET /health/embedding"},"reranking":{"native":"POST /rerank","openai_compatible":"POST /v1/rerank","info":"GET /info/rerank","health":"GET /health/rerank"}}}';
    }

    # --------------------------------------------------------------------------
    # 1. ROUTING CHO EMBEDDING SERVICE (Port 8080)
    # --------------------------------------------------------------------------
    
    # Endpoint chuẩn của TEI (/embed)
    location /embed {
        proxy_pass http://tei-embedding:80/embed;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Endpoint dự đoán phân loại/predict (/predict)
    location /predict {
        proxy_pass http://tei-embedding:80/predict;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Endpoint tương thích OpenAI (/v1/embeddings)
    location /v1/embeddings {
        proxy_pass http://tei-embedding:80/v1/embeddings;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Thông tin & Health check của Embedding Service
    location /health/embedding {
        proxy_pass http://tei-embedding:80/health;
    }

    location /info/embedding {
        proxy_pass http://tei-embedding:80/info;
    }

    # --------------------------------------------------------------------------
    # 2. ROUTING CHO RERANKER SERVICE (Port 8081)
    # --------------------------------------------------------------------------
    
    # Endpoint rerank chuẩn (/rerank)
    location /rerank {
        proxy_pass http://tei-reranker:80/rerank;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Endpoint alias /v1/rerank
    location /v1/rerank {
        proxy_pass http://tei-reranker:80/rerank;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Thông tin & Health check của Reranker Service
    location /health/rerank {
        proxy_pass http://tei-reranker:80/health;
    }

    location /info/rerank {
        proxy_pass http://tei-reranker:80/info;
    }
}
